services:
  - type: web
    name: chargecore-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: csms_crode
      - key: DEBUG
        value: "false"
      - key: OCPP_COMMAND_TIMEOUT_SECONDS
        value: "30"

  - type: web
    name: chargecore-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: python nicegui_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NICEGUI_STORAGE_SECRET
        generateValue: true
      - key: CHARGECORE_API_URL
        fromService:
          type: web
          name: chargecore-backend
          envVarKey: RENDER_EXTERNAL_URL

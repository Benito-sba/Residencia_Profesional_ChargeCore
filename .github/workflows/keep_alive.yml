name: Render Keep Alive 24/7

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar Backend de Render
        run: |
          curl -s https://chargecore-backend.onrender.com/health || true

      - name: Despertar Frontend de Render
        run: |
          curl -s https://chargecore-frontend.onrender.com || true
